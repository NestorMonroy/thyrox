# PS8 — Problem Solving 8D (Eight Disciplines)
# type: conditional
# Ejemplo canónico del tipo condicional para el coordinator genérico.
# D4 puede regresar a D3 si las causas raíz no están confirmadas.
# D5 puede regresar a D4 si las acciones propuestas no eliminan la causa raíz.

id: ps8
type: conditional
display: "PS8 — Problem Solving 8D"
note: >
  Metodología 8D de resolución de problemas (Ford / Automotive). El flujo es
  mayormente secuencial pero con retornos condicionales en las fases de análisis.
  D0 es un pre-step de evaluación — si el problema no cumple los criterios 8D,
  se deriva a otro proceso.

steps:
  - id: ps8:d0
    display: "D0 — Emergency Response Action (ERA) y evaluación de síntomas"
    activities: ["Evaluar si el problema requiere 8D", "Implementar ERA si hay riesgo inmediato", "Documentar síntomas iniciales"]
    output: "Decisión: 8D necesario O derivar a otro proceso"
    next:
      on_8d_required: [ps8:d1]
      on_not_8d: []

  - id: ps8:d1
    display: "D1 — Formar el equipo"
    activities: ["Identificar miembros con knowledge/skills necesarios", "Definir champion y líder 8D", "Asignar roles y responsabilidades"]
    output: "Team charter con miembros, roles y disponibilidad"
    next:
      on_complete: [ps8:d2]

  - id: ps8:d2
    display: "D2 — Describir el problema"
    activities: ["Definir el problema en términos cuantificables (IS/IS-NOT)", "Especificar: qué, dónde, cuándo, quién, cuánto", "Recopilar evidencia del problema"]
    output: "Problem Statement con IS/IS-NOT matrix"
    next:
      on_complete: [ps8:d3]

  - id: ps8:d3
    display: "D3 — Contener el problema (ICA — Interim Containment Action)"
    activities: ["Identificar acciones de contención inmediata", "Implementar ICA para proteger al cliente", "Verificar efectividad de la contención"]
    output: "ICA implementada y verificada"
    next:
      on_contained: [ps8:d4]

  - id: ps8:d4
    display: "D4 — Identificar y verificar causas raíz"
    activities: ["Brainstorming de causas potenciales", "Análisis 5 Whys / Ishikawa", "Verificar causas con datos (prueba/comprobación)"]
    output: "Causa(s) raíz verificada(s) con datos"
    next:
      on_root_cause_confirmed: [ps8:d5]
      on_root_cause_unclear: [ps8:d3]

  - id: ps8:d5
    display: "D5 — Elegir y verificar acciones correctivas permanentes (PCA)"
    activities: ["Generar alternativas de PCA", "Verificar que PCA elimina la causa raíz (en banco de pruebas)", "Seleccionar PCA óptima (costo/beneficio/riesgo)"]
    output: "PCA seleccionada y verificada antes de implementación"
    next:
      on_pca_verified: [ps8:d6]
      on_pca_insufficient: [ps8:d4]

  - id: ps8:d6
    display: "D6 — Implementar y validar PCAs"
    activities: ["Implementar PCA en producción", "Retirar ICA (si ya no es necesaria)", "Validar que el problema no recurrió"]
    output: "PCA implementada con datos de validación post-implementación"
    next:
      on_validated: [ps8:d7]

  - id: ps8:d7
    display: "D7 — Prevenir recurrencia (sistémico)"
    activities: ["Actualizar SOPs, documentación y estándares", "Actualizar FMEAs si aplica", "Replicar solución en productos/procesos similares", "Revisar sistemas de control"]
    output: "Documentación actualizada + controles sistémicos implementados"
    next:
      on_complete: [ps8:d8]

  - id: ps8:d8
    display: "D8 — Reconocer contribuciones del equipo"
    activities: ["Documentar lecciones aprendidas", "Reconocer al equipo formalmente", "Archivar el 8D en la base de conocimiento"]
    output: "8D cerrado y archivado + lecciones aprendidas documentadas"
    next:
      on_complete: []
